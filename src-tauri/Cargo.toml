[package]
name = "playerwcy"
version = "1.7.0"
description = "playerWCY 视频播放器（macOS）"
authors = ["wcy"]
edition = "2021"

[lib]
name = "playerwcy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite 静态编译进二进制（bundled），无需系统安装 SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# macOS 专属依赖：CoreAudio 系统音量读写（target 声明确保 Android 编译时完全排除，
# 仅在模块上加 cfg 不够——crate 级依赖会尝试为 Android 链接而失败）
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
