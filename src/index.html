<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playerWCY</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <!-- 左侧：文件夹导航（分组树 + 多选删除） -->
    <aside id="sidebar">
      <button id="btn-open-folder" title="选择视频文件夹（添加/刷新）">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>打开文件夹</span>
      </button>
      <ul id="video-list"></ul>
      <div id="sel-bar" class="sel-bar" hidden>
        <button id="btn-del-sel" class="danger">删除所选 (<span id="sel-count">0</span>)</button>
        <button id="btn-cancel-sel">取消</button>
      </div>
    </aside>

    <!-- 主区：播放器 -->
    <main id="main">
      <div id="video-wrap">
        <button id="btn-toggle-sidebar" title="收起/展开导航"></button>
        <video id="player"></video>
        <div id="empty-tip">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M10 7l5 3-5 3V7z"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <p>打开文件夹后，点击左侧视频开始播放</p>
          <p class="tip-keys">空格 暂停/播放 ｜ ←/→ 快退/快进 5 秒（按住加速）</p>
        </div>
        <div id="error-tip" hidden>
          <p id="error-msg"></p>
          <p class="tip-keys">文件可能已被移动、删除或编码不受支持；可在左侧列表右键删除该记录</p>
        </div>
      </div>

      <!-- 控制栏 -->
      <div id="controls">
        <div id="progress-row">
          <span id="time-cur" class="time">00:00</span>
          <input type="range" id="seek-bar" min="0" max="1000" value="0" step="1" />
          <span id="time-dur" class="time">00:00</span>
        </div>
        <div id="btn-row">
          <div class="btn-group">
            <button id="btn-back" title="快退 5 秒">
              <svg viewBox="0 0 24 24"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
              <span>5s</span>
            </button>
            <button id="btn-play" title="播放/暂停（空格）"></button>
            <button id="btn-fwd" title="快进 5 秒">
              <span>5s</span>
              <svg viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>
            </button>
            <button id="btn-mode" title="点击切换播放模式：播完下集 → 列表循环 → 单集循环 → 播完暂停"></button>
          </div>
          <div class="btn-group speed-group">
            <label class="hotkeys-toggle" title="倍速快捷键开关（数字键 1-5）">
              <input type="checkbox" id="rate-hotkeys" checked />
              <span class="tg-track"><span class="tg-knob"></span></span>
            </label>
            <span class="label">倍速</span>
            <button class="btn-rate" data-rate="0.5" data-slot="1" title="0.5 倍速（快捷键 1）">0.5x<kbd>1</kbd></button>
            <button class="btn-rate" data-rate="1" data-slot="2" title="1 倍速（快捷键 2）">1x<kbd>2</kbd></button>
            <button class="btn-rate" data-rate="1.5" data-slot="3" title="1.5 倍速（快捷键 3）">1.5x<kbd>3</kbd></button>
            <button class="btn-rate" data-rate="2" data-slot="4" title="2 倍速（快捷键 4）">2x<kbd>4</kbd></button>
            <span class="rate-input-wrap" title="自定义倍速，快捷键 5 应用此值">
              <input type="text" id="rate-input" placeholder="1.65" maxlength="4"
                     title="输入 0.50 - 2.00 之间的倍速（快捷键 5 应用）" />
              <kbd>5</kbd>
            </span>
          </div>
          <div class="btn-group volume-group">
            <span class="label" title="音量（与系统音量同步）">
              <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </span>
            <input type="range" id="volume" min="0" max="100" value="100" />
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="ctx-menu" class="ctx-menu" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
